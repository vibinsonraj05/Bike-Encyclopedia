<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Encyclopedia</title>
    <Style>
        
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
            background-color: #8EC5FC;
            background-image: linear-gradient(62deg, #8EC5FC 0%, #E0C3FC 100%);

        }
        input {
            width: 50%;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 16px;
        }
        #bikeContainer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .bike {
            width: 200px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
        }
        .bike img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        }
        .bike:hover {
            transform: scale(1.05);
        }
        /* Premium bike details modal */
        #bikeModal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            padding: 24px;
            background: rgba(8, 13, 25, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        #bikeModal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            position: relative;
            width: min(900px, 94vw);
            max-height: 90vh;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            align-items: center;
            gap: 30px;
            padding: 30px;
            color: #f8fafc;
            text-align: left;
            background: linear-gradient(145deg, rgba(24, 34, 55, 0.98), rgba(12, 19, 35, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 24px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.48), 0 0 35px rgba(96, 165, 250, 0.12);
            animation: modalPop 0.32s cubic-bezier(.2,.8,.2,1) both;
        }

        .modal-image-wrap {
            overflow: hidden;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-content img {
            display: block;
            width: 100%;
            max-height: 430px;
            object-fit: contain;
            transition: transform 0.45s ease;
        }

        .modal-image-wrap:hover img {
            transform: scale(1.035);
        }

        .modal-details {
            padding: 8px 6px 8px 0;
        }

        .modal-eyebrow {
            margin: 0 0 10px;
            color: #7dd3fc;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .modal-content h2 {
            margin: 0 0 16px;
            color: #ffffff;
            font-size: clamp(25px, 4vw, 38px);
            line-height: 1.12;
        }

        #bikeDescription {
            margin: 0;
            color: #cbd5e1;
            font-size: 15px;
            line-height: 1.8;
        }

        .close-btn {
            position: absolute;
            top: 14px;
            right: 16px;
            z-index: 2;
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            color: #e2e8f0;
            font-size: 27px;
            line-height: 1;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .close-btn:hover {
            color: #fff;
            background: #ef4444;
            transform: rotate(90deg);
        }

        @keyframes modalPop {
            from { opacity: 0; transform: translateY(18px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 680px) {
            #bikeModal { padding: 14px; }
            .modal-content {
                width: 100%;
                grid-template-columns: 1fr;
                gap: 18px;
                padding: 22px;
                border-radius: 20px;
            }
            .modal-content img { max-height: 270px; }
            .modal-details { padding: 0; }
            .modal-content h2 { padding-right: 28px; }
        }
    </Style>
</head>
<body>

    <!-- Search Bar -->
    <input type="text" id="searchInput" placeholder="Search for bikes..." onkeyup="searchBikes()">
    
    <!-- Container for Bikes -->
    <div id="bikeContainer"></div>

    <!-- Modal for Bike Details -->
    <div id="bikeModal" onclick="if (event.target === this) closeModal()">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="bikeName">
            <button class="close-btn" type="button" aria-label="Close details" onclick="closeModal()">&times;</button>
            <div class="modal-image-wrap">
                <img id="bikeImage" src="" alt="Bike Image">
            </div>
            <div class="modal-details">
                <p class="modal-eyebrow">Bike Encyclopedia</p>
                <h2 id="bikeName"></h2>
                <p id="bikeDescription"></p>
            </div>
        </div>
    </div>

// Function to load bikes initially
function loadBikes() {
    displayBikes(bikes);
}

// Function to display bikes
function displayBikes(bikeList) {
    let bikeContainer = document.getElementById("bikeContainer");
    bikeContainer.innerHTML = ""; // Clear the container before displaying bikes

    if (bikeList.length === 0) {
        bikeContainer.innerHTML = "<p>No bikes found.</p>";
        return;
    }

    bikeList.forEach(bike => {
        let bikeDiv = document.createElement("div");
        bikeDiv.classList.add("bike");
        bikeDiv.innerHTML = `<img src="${bike.image}" alt="${bike.name}" onclick="openBikeModal('${bike.id}')">`;
        bikeContainer.appendChild(bikeDiv);
    });
}

// Function to search bikes
function searchBikes() {
    let searchTerm = document.getElementById("searchInput").value.toLowerCase();
    let filteredBikes = bikes.filter(bike => bike.name.toLowerCase().includes(searchTerm));
    displayBikes(filteredBikes);
}

// Function to open the bike modal with details
function openBikeModal(bikeId) {
    let bike = bikes.find(b => b.id === bikeId);

    if (!bike) {
        alert("Bike details not found.");
        return;
    }

    document.getElementById("bikeName").innerText = bike.name;
    document.getElementById("bikeImage").src = bike.image;
    document.getElementById("bikeDescription").innerText = bike.description;

    const modal = document.getElementById("bikeModal");
    modal.style.display = "flex";

    // Allow the browser to apply display:flex before starting the fade-in.
    requestAnimationFrame(() => {
        modal.classList.add("show");
    });

    document.body.style.overflow = "hidden";
}

// Function to close the modal
function closeModal() {
    const modal = document.getElementById("bikeModal");
    modal.classList.remove("show");
    document.body.style.overflow = "";
    setTimeout(() => {
        if (!modal.classList.contains("show")) modal.style.display = "none";
    }, 250);
}

// Close the popup with the Escape key
window.addEventListener("keydown", event => {
    if (event.key === "Escape") closeModal();
});

// Load bikes on page load
window.onload = loadBikes;

   </script>

</body>
